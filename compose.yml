services:
  db:
    build: ./db
    restart: always
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

  web:
    image: ghcr.io/vero0996/ad2026-app-base:
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
